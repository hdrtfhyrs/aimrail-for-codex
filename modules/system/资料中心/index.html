<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI工作系统 · 资料登记中心</title>
<style>
:root{--ink:#233940;--muted:#627478;--line:#dce5e3;--green:#176b5b;--paper:#fff;--bg:#f3f6f4}*{box-sizing:border-box}body{margin:0;font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button,a{color:var(--green)}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px}button:hover{background:#edf5f1}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}a{text-decoration:none}a:hover{text-decoration:underline}header{background:#fff;border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1240px)/2));display:flex;gap:25px;justify-content:space-between;align-items:center}header h1{font-size:26px;margin:0;letter-spacing:.02em}header p{margin:4px 0 0;color:var(--muted);font-size:14px}.pill{display:inline-block;font-size:12px;border-radius:6px;padding:3px 8px;background:#e9f2ee;color:#296451}.muted{color:var(--muted)}main{max-width:1240px;margin:22px auto;padding:0 24px}.notice{padding:15px 19px;background:#e9f2ed;border:1px solid #d4e4d8;border-radius:12px;margin-bottom:21px}.notice strong{display:block}.notice p{margin:4px 0;font-size:14px}nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}nav button{border-color:transparent;background:transparent;padding:9px 15px}nav button.active{background:#fff;border-color:var(--line);color:var(--green);font-weight:650}.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 17px}.toolbar input{flex:1;min-width:120px}input,textarea,select{border:1px solid #cbd7d3;border-radius:7px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}input:focus,textarea:focus,select:focus{outline:2px solid #91b8ab;outline-offset:1px}textarea{min-height:85px;resize:vertical}h2{font-size:21px;margin:0 0 5px}h3{font-size:17px;margin:0 0 12px}.sub{margin:0 0 18px;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.card{cursor:pointer}.card b{font-size:30px;display:block;color:var(--green)}.card span{color:var(--muted)}.panels{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:18px}.entry{border-top:1px solid #e6edeb;padding:14px 0}.entry:first-of-type{border-top:0}.entry p{margin:3px 0;font-size:14px}.entry .meta{font-size:12px;color:var(--muted)}.rowtop{display:flex;align-items:center;justify-content:space-between;gap:16px}.rowtop strong{font-size:16px}.badge{border-radius:5px;padding:2px 7px;font-size:12px;background:#f2f0e5;color:#776339;white-space:nowrap}.badge.ok{background:#e8f3ea;color:#316941}.badge.gray{background:#eef1f1;color:#667777}.gridtable{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:13px;color:var(--muted);background:#f8faf9}th,td{padding:15px 18px;border-bottom:1px solid #e6edeb;vertical-align:top}tbody tr:last-child td{border:0}td small{display:block;font-size:12px;color:var(--muted);margin-top:3px}td .purpose{max-width:400px;font-size:14px}.empty{padding:30px;color:var(--muted);text-align:center}#status{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#213f36;color:#fff;padding:12px 22px;border-radius:10px;z-index:20;max-width:90%;box-shadow:0 5px 25px #163f3928;display:none}dialog{border:1px solid var(--line);padding:0;border-radius:15px;width:min(860px,calc(100% - 32px));max-height:90vh;color:var(--ink);box-shadow:0 18px 70px #13352c33}dialog::backdrop{background:#163b343d}.dialoghead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dialogbody{padding:22px 24px;overflow:auto;max-height:67vh}.dialogfoot{border-top:1px solid var(--line);padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fafcfb}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{display:block;font-size:13px;font-weight:600}.fields label.full{grid-column:1/-1}.fields label span{display:block;margin-bottom:5px}.fields input,.fields textarea,.fields select{font-size:14px;font-weight:400}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 system-ui;color:#486268;background:#f4f7f5;padding:15px;border-radius:8px}.proof{font-size:13px;overflow-wrap:anywhere}footer{padding:23px 0;font-size:12px;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.filters button.selected{background:#e9f2ee;border-color:#b6d2c5}.systemtask{margin-bottom:9px;box-shadow:none}.hint{border-left:3px solid #b6d2c5;padding-left:12px;font-size:13px;margin:15px 0;color:var(--muted)}@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}header{align-items:start;padding:18px 24px}.fields{grid-template-columns:1fr}.fields label.full{grid-column:1}th,td{padding:12px 10px}.optionalcol{display:none}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head><body>
<header><div><h1>资料登记中心</h1><p>AI工作系统 · 账号、权益、资源与共用经验</p></div><div><span class="pill">由系统整理与维护</span><p><a href="/">运行中心 ↗</a></p></div></header>
<main><div class="notice"><strong>系统负责找资料、核依据、维护记录，再交回有用结果。</strong><p>这里查看系统已掌握的事实和仍待查的事项。经验与错误共用检索，记录保留出处和实际验证范围。</p></div>
<nav id="tabs" aria-label="资料类别"></nav><section id="content"><p>正在读取已有资料…</p></section><footer id="stamp"></footer></main>
<dialog id="editor"><div class="dialoghead"><h2 id="editorTitle"></h2><button id="closeDialog" aria-label="关闭">关闭</button></div><div id="editorBody" class="dialogbody"></div><div class="dialogfoot"><span class="muted" id="saveHint">保存前保留原件，可沿备份恢复。</span><button class="primary" id="saveButton">保存更正</button></div></dialog>
<div id="status" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),api='/registry/api/';
let init,tab='overview',query='',cardType='all',editing=null,loadSequence=0,knowledgeLimit=20;
const labels={overview:'总览',accounts:'账号',benefits:'权益',resources:'工具与资源',sources:'信息来源',knowledge:'经验与错误',work:'系统待查'};
const knowledgeLabels={all:'全部',experience:'成功经验',error:'错误记录',knowledge:'知识说明'};
async function request(endpoint,options={}){const r=await fetch(api+endpoint,{...options,headers:{...(options.body?{'Content-Type':'application/json','X-Registry-Token':init.token}:{}),...options.headers}}),d=await r.json();if(!r.ok)throw Error(d.error||'资料读取失败');return d;}
function toast(s){$('status').textContent=s;$('status').style.display='block';setTimeout(()=>$('status').style.display='none',5500);}
function badge(s){return '<span class="badge '+(s==='已验证'?'ok':s==='停用'?'gray':'')+'">'+esc(s||'待核实')+'</span>';}
async function boot(){try{init=await request('init');$('stamp').textContent='系统登记版本 '+init.summary.revision+' · 最近保存 '+new Date(init.summary.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+' · 原观察日期见每条记录';renderTabs();await load();}catch(e){$('content').innerHTML='<div class="panel">'+esc(e.message)+'</div>';}}
function renderTabs(){$('tabs').innerHTML=Object.entries(labels).map(([k,v])=>'<button data-tab="'+k+'" class="'+(k===tab?'active':'')+'">'+v+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;query='';renderTabs();load();});}
function toolbar(description,knowledge=false){return '<h2>'+labels[tab]+'</h2><p class="sub">'+description+'</p><div class="toolbar"><input id="search" type="search" aria-label="搜索资料" placeholder="搜索系统已整理的名称、用途或依据" value="'+esc(query)+'"><button id="searchButton">搜索</button><button id="newButton">补充一条</button><a href="/registry/api/export">导出登记</a></div>'+(knowledge?'<div class="filters">'+Object.entries(knowledgeLabels).map(([k,v])=>'<button data-type="'+k+'" class="'+(cardType===k?'selected':'')+'">'+v+'</button>').join('')+'</div>':'');}
function bindToolbar(){if($('search')){$('searchButton').onclick=()=>{query=$('search').value;load();};$('search').onkeydown=e=>{if(e.key==='Enter')$('searchButton').click();};$('newButton').onclick=()=>tab==='knowledge'?openNewCard():openRecord({kind:tab,status:'待核实'});}}
async function load(){const sequence=++loadSequence;try{
 if(tab==='overview'){const [records,work]=await Promise.all([request('records'),request('work')]);if(sequence!==loadSequence)return;renderOverview(records,work);return;}
 if(tab==='work'){const work=await request('work');if(sequence!==loadSequence)return;renderWork(work);return;}
 if(tab==='knowledge'){const d=await request('knowledge?type='+cardType+'&query='+encodeURIComponent(query));if(sequence!==loadSequence)return;renderKnowledge(d);return;}
 const d=await request('records?kind='+tab+'&query='+encodeURIComponent(query));if(sequence!==loadSequence)return;
 $('content').innerHTML=toolbar(init.schemas[tab].description)+'<div class="gridtable"><table><thead><tr><th>系统已记录</th><th>用途与接入情况</th><th class="optionalcol">原观察日期</th><th></th></tr></thead><tbody>'+d.items.map((r,i)=>'<tr><td><strong>'+esc(r.name)+'</strong><small>'+esc(r.accountName||r.platform||r.category||'')+'</small>'+badge(r.status)+'</td><td><div class="purpose">'+esc(r.purpose||r.accessState||'用途待系统核对')+'</div><small>'+esc(r.nextAction?'系统下一步：'+r.nextAction:'')+'</small></td><td class="optionalcol">'+esc(r.observedAt||'未取得')+'</td><td><button data-record="'+i+'">查看 / 更正</button></td></tr>').join('')+'</tbody></table>'+(d.items.length?'':'<div class="empty">此范围暂无记录。系统仍可沿已有来源发现资料。</div>')+'</div>';bindToolbar();$('content').querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>openRecord(d.items[Number(b.dataset.record)]));
 }catch(e){if(sequence===loadSequence)$('content').innerHTML='<div class="panel">'+esc(e.message)+'</div>';}}
function renderOverview(records,work){const benefits=records.items.filter(r=>r.kind==='benefits'),notable=benefits.filter(r=>/62500|62,500|5 TB|5TB/.test(r.amount+' '+r.remaining));$('content').innerHTML='<div class="cards">'+Object.entries(init.summary.counts).map(([k,n])=>'<div class="card" data-jump="'+k+'"><span>'+labels[k]+'</span><b>'+n+'</b><small class="muted">系统已整理的记录</small></div>').join('')+'</div><div class="panels"><section class="panel"><h3>已发现的账号权益</h3>'+notable.slice(0,4).map(r=>'<div class="entry"><div class="rowtop"><strong>'+esc(r.name)+'</strong>'+badge(r.status)+'</div><p>'+esc(r.remaining?'剩余：'+r.remaining:r.amount)+'</p><p class="meta">'+esc(r.expiresOn?'期限 '+r.expiresOn:'')+' · 原观察 '+esc(r.observedAt||'未取得')+'</p><button data-overview-record="'+r.id+'">查看依据</button></div>').join('')+'</section><section class="panel"><h3>系统接下来查什么</h3><p class="sub">'+work.resources.count+' 项资料接续；'+work.failures.count+' 条本项目失败线索或待真实再遇记录。由系统处理。</p>'+work.resources.items.slice(0,3).map(r=>'<div class="entry"><strong>'+esc(r.name)+'</strong><p>'+esc(r.nextAction)+'</p></div>').join('')+'<button data-jump="work">查看系统待查</button></section></div><section class="panel" style="margin-top:18px"><h3>经验与错误怎样复用</h3><p>成功经验保存能照做的办法，错误记录保存失败条件和修正动作，知识说明解释原理。它们从同一份原件检索，按当前任务选择相关内容。</p><p class="hint">候选送达、全文读取、采取修法、后续实际有效是不同环节。这里提供原件和接续线索；长期是否减少同类错误要看真实任务。</p><button data-jump="knowledge">查看共用记录</button></section>';$('content').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{tab=b.dataset.jump;renderTabs();load();});$('content').querySelectorAll('[data-overview-record]').forEach(b=>b.onclick=()=>openRecord(records.items.find(r=>r.id===b.dataset.overviewRecord)));}
function renderWork(work){$('content').innerHTML='<h2>系统待查</h2><p class="sub">资料由AI查证和更新。记录只描述实际缺口，具体业务按当前授权接续。</p><section class="panel"><h3>资料接续 · '+work.resources.count+' 项</h3>'+work.resources.items.map((r,i)=>'<div class="entry"><div class="rowtop"><strong>'+esc(r.name)+'</strong><span class="pill">系统负责</span></div><p>'+esc(r.nextAction)+'</p><p class="meta">'+esc(r.reason||r.blockedBy)+'</p><button data-work-record="'+r.id+'">查看记录</button></div>').join('')+'</section><section class="panel" style="margin-top:18px"><h3>本项目失败线索与真实再遇 · '+work.failures.count+' 条</h3><p class="sub">“已记处理说明”继续保留，等待真实任务核做法与结果。失败原因来自原件，个别线索仍需辨认。</p>'+work.failures.items.map((r,i)=>'<div class="entry"><div class="rowtop"><strong>'+esc(r.status==='note-only'?'已记处理说明，待真实再遇':r.status==='needs-review'?'重复线索待核':'失败线索待核')+'</strong><span class="badge gray">'+esc(r.count)+' 次记录</span></div><p>'+esc(r.diagnostic)+'</p><p class="meta">'+esc(r.tool||'')+' · '+esc(r.lastSeen||'')+'</p><details><summary>原证与系统下一步</summary><p>'+esc(r.nextAction)+'</p><pre>'+esc(JSON.stringify({originalStatus:r.status,originalEvidence:r.evidence,resolutionEvidence:r.resolutionEvidence},null,2))+'</pre></details></div>').join('')+'</section>';$('content').querySelectorAll('[data-work-record]').forEach(b=>b.onclick=async()=>{try{const d=await request('records');openRecord(d.items.find(r=>r.id===b.dataset.workRecord));}catch(e){toast(e.message);}});}
function renderKnowledge(d){const shown=d.items.slice(0,knowledgeLimit);$('content').innerHTML=toolbar('成功办法、踩坑记录与知识说明，共用原件和检索。新增记录可以明确标为待验证。',true)+'<p class="sub">当前显示 '+shown.length+' 条 / 本次找到 '+d.items.length+' 条</p><div class="panel">'+shown.map((r,i)=>'<div class="entry"><div class="rowtop"><strong>'+esc(r.title)+'</strong><span class="badge gray">'+esc(knowledgeLabels[r.type]||r.type)+'</span></div><p>'+esc(r.summary||'')+'</p><p class="meta">'+esc(r.source||'')+'</p><button data-card="'+i+'">查看原件</button></div>').join('')+(d.items.length?'':'<div class="empty">此查询暂无相关原件。</div>')+'</div>'+(d.items.length>shown.length?'<p><button id="moreKnowledge">再显示20条</button></p>':'');bindToolbar();if($('moreKnowledge'))$('moreKnowledge').onclick=()=>{knowledgeLimit+=20;renderKnowledge(d);};$('content').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{cardType=b.dataset.type;knowledgeLimit=20;load();});$('content').querySelectorAll('[data-card]').forEach(b=>b.onclick=async()=>{try{openCard(await request('card?ref='+encodeURIComponent(d.items[Number(b.dataset.card)].ref)));}catch(e){toast(e.message);}});}
function inputFor(f,value){const attrs='name="'+f.key+'" '+(f.required?'required':'');if(f.type==='textarea')return '<textarea '+attrs+'>'+esc(value)+'</textarea>';if(f.type==='select'||f.type==='account'){const options=f.type==='account'?[{id:'',name:'未关联'},...init.accounts]:f.options.map(x=>({id:x,name:x||'未记录'}));return '<select '+attrs+'>'+options.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===value?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';}return '<input '+attrs+' type="'+(f.type==='date'?'date':'text')+'" value="'+esc(value)+'">';}
function openRecord(r){if(!r)return;editing={mode:'record',r};$('editorTitle').textContent=r.id?r.name:'补充'+labels[r.kind];$('editorBody').innerHTML='<p class="sub">系统维护记录；空白表示当前尚未取得。观察日期描述证据当时的状态。</p><form id="recordForm" class="fields">'+init.schemas[r.kind].fields.map(f=>'<label class="'+(f.type==='textarea'?'full':'')+'"><span>'+esc(f.label)+'</span>'+inputFor(f,r[f.key]||'')+'</label>').join('')+'</form>';$('saveButton').disabled=false;$('saveButton').textContent='保存更正';$('saveHint').textContent='系统保存时保留旧版本；权益和余额沿实际依据维护。';$('editor').showModal();}
function openNewCard(){openCard({type:cardType==='error'?'error':'experience',editable:true,fields:{},title:'',verification:'待验证'});}
function openCard(r){editing={mode:'card',r};$('editorTitle').textContent=r.ref?r.title:'补充经验或错误';const fields=r.fields||{},spec=[['title','记录名称'],['symptom','遇到的具体问题'],['conditions','适用条件'],['action','下一次采用的具体办法'],['evidence','原证或真实结果位置'],['result','已观察的结果'],['boundary','尚未证明的边界']];
 if(r.editable){$('editorBody').innerHTML='<p class="sub">'+esc(r.verificationNote||'记录事实和下一次具体动作，保存本身不证明办法有效。')+'</p><form id="cardForm" class="fields"><label><span>类型</span><select name="type"><option value="experience" '+(r.type==='experience'?'selected':'')+'>成功经验</option><option value="error" '+(r.type==='error'?'selected':'')+'>错误记录</option></select></label><label><span>验证层级</span><select name="verification"><option '+((fields.verification||r.verification)!=='已验证'?'selected':'')+'>待验证</option><option '+((fields.verification||r.verification)==='已验证'?'selected':'')+'>已验证</option></select></label>'+spec.map(([key,label])=>'<label class="full"><span>'+label+'</span>'+inputFor({key,type:key==='title'?'text':'textarea'},key==='title'?r.title:fields[key]||'')+'</label>').join('')+'</form>'+(r.body?'<details style="margin-top:18px"><summary>已有原文（精确编辑）</summary><p class="hint">结构字段为空时，可以直接修改原文，保留原有事实和边界。</p><label><input id="rawMode" type="checkbox" style="width:auto"> 保存以下原文</label><textarea id="rawBody" style="min-height:260px">'+esc(r.body)+'</textarea></details>':'');}
 else $('editorBody').innerHTML='<p class="sub">'+esc(r.readOnlyReason||'原件由原维护流程更新，此入口用于读取。')+'</p><p class="proof">'+esc(r.source)+'</p><pre>'+esc(r.body)+'</pre>';
 $('saveButton').disabled=!r.editable;$('saveButton').textContent='保存记录';$('saveHint').textContent=r.editable?'写回现有共用原件；原有卡修改前留备份。':'保留原件；聚合历史与知识说明按原维护方式更新。';$('editor').showModal();}
$('closeDialog').onclick=()=>$('editor').close();
$('saveButton').onclick=async()=>{try{$('saveButton').disabled=true;if(editing.mode==='record'){const form=$('recordForm');if(!form.reportValidity())return;const record={...editing.r,...Object.fromEntries(new FormData(form))};await request('records',{method:'POST',body:JSON.stringify({kind:record.kind,record})});}else{const record={...Object.fromEntries(new FormData($('cardForm'))),ref:editing.r.ref,version:editing.r.version};if($('rawMode')?.checked)record.body=$('rawBody').value;await request('card',{method:'POST',body:JSON.stringify(record)});} $('editor').close();toast('原件已保存，正在重读。');await boot();}catch(e){toast(e.message);}finally{$('saveButton').disabled=false;}};
boot();
</script></body></html>
