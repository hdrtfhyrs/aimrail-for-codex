<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>聊天管理</title><style>
:root{font:14px system-ui,"Microsoft YaHei",sans-serif;color:#172535;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{padding:24px 30px;background:#172a3a;color:white}h1{margin:0 0 8px;font-size:25px}header p{margin:0;color:#bacbd6}main{display:grid;grid-template-columns:310px 1fr;gap:24px;padding:24px;max-width:1480px;margin:auto}aside,section{background:white;border:1px solid #dce2e8;border-radius:14px;padding:18px}h2{font-size:18px;margin:0 0 16px}.hint{font-size:12px;line-height:1.7;color:#667788}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}input{flex:1;min-width:160px}input,button{font:inherit;border:1px solid #ced8e1;border-radius:7px;padding:8px 11px;background:white}button{cursor:pointer;color:#224d70}button.primary{background:#205c81;color:white;border-color:#205c81}button:disabled{opacity:.55;cursor:wait}details{margin:9px 0}summary{cursor:pointer;padding:6px 0;font-weight:600}details.duty{padding-left:13px;border-left:2px solid #e0e9ef}aside button{border:0;text-align:left;width:100%;background:transparent;padding:7px 5px;font-size:12px}.selected{background:#e7f2f8!important;color:#145577}.chat{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #e6ebef}.title{font-weight:550;font-size:14px;margin-bottom:6px;line-height:1.6;word-break:break-word}.meta{font-size:12px;color:#708091}.goal{margin-top:7px;font-size:12px;color:#516576;line-height:1.6}.status{min-height:24px;color:#1c6670}.badge{display:inline-block;border-radius:4px;background:#eef3f7;padding:2px 5px;margin-right:6px}.empty{padding:35px 0;color:#708091}footer{padding:0 24px 24px;max-width:1480px;margin:auto}.error{color:#af3333}@media(max-width:850px){main{grid-template-columns:1fr}aside{max-height:360px;overflow:auto}}
</style></head><body><header><h1>聊天管理</h1><p>直接查找旧聊，从最近打开，项目和职责由 AI 整理。</p></header><main><aside><h2>项目与职责</h2><div class="hint">默认收起；选择聊天只展开它的项目和职责。</div><div id="tree"></div></aside><section><h2>全局最近 <span id="count" class="meta"></span></h2><div class="toolbar"><input id="q" placeholder="搜索标题、项目或职责"><button id="full">搜索原文</button><button id="refresh">刷新</button></div><div id="status" class="status" role="status"></div><div id="list"></div><p id="stamp" class="hint"></p></section></main><footer class="hint">这是原版浏览器面板中的管理页，原左侧栏仍保留。最近按本机原版 threads.updated_at 排序，跨职责保留；当前覆盖本机活跃 Codex 根聊天，不声称整个云端账号。页面只在打开、刷新、搜索和点击时读取或操作，空闲不扫描、不调用 AI。</footer><script>
const KEY='__NONCE__',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,selected=null;
const group=r=>r.groupKey||'unassigned',project=r=>r.project?r.project.replaceAll('\\','/').split('/').at(-1):'未归属';
function selectedPath(){document.querySelectorAll('#tree details').forEach(d=>{d.open=false});const r=data?.items.find(r=>r.threadId===selected);if(!r)return;document.querySelectorAll('#tree details.project').forEach(d=>{if(d.dataset.project===project(r))d.open=true});document.querySelectorAll('#tree details.duty').forEach(d=>{if(d.dataset.project===project(r)&&d.dataset.group===group(r))d.open=true});document.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('selected',b.dataset.id===selected));}
async function go(id){selected=id;selectedPath();$('status').textContent='正在打开原版聊天…';try{const res=await fetch('/api/open',{method:'POST',headers:{'content-type':'application/json','x-action-key':KEY},body:JSON.stringify({threadId:id})}),r=await res.json();if(!res.ok)throw Error(r.error);$('status').textContent=r.result.navigated?'已在原版打开聊天':'原版返回：'+JSON.stringify(r.result);}catch(e){$('status').textContent=e.message;$('status').classList.add('error');}}
function bind(){document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id));selectedPath();}
function tree(){const projects=[...new Set(data.items.map(project))];$('tree').innerHTML=projects.map(p=>{const rs=data.items.filter(r=>project(r)===p),groups=[...new Set(rs.map(group))];return '<details class="project" data-project="'+esc(p)+'"><summary>'+esc(p)+' <span class="meta">'+rs.length+'</span></summary>'+groups.map(g=>'<details class="duty" data-project="'+esc(p)+'" data-group="'+esc(g)+'"><summary>'+esc(rs.find(r=>group(r)===g)?.groupName||'待归属')+'</summary>'+rs.filter(r=>group(r)===g).map(r=>'<button data-id="'+esc(r.threadId)+'">'+esc(r.title.slice(0,70))+'</button>').join('')+'</details>').join('')+'</details>';}).join('');}
function list(rows){$('count').textContent=rows.length+' 个聊天';$('list').innerHTML=rows.map(r=>'<div class="chat"><div><div class="title">'+esc(r.title)+'</div><div class="meta"><span class="badge">'+esc(project(r))+'</span>'+esc(r.groupName||'待归属')+' · '+esc(new Date(r.updatedAt*1000).toLocaleString('zh-CN'))+(r.kind==='test'?' · 实验记录':'')+'</div></div><div><button class="primary" data-id="'+esc(r.threadId)+'">打开</button></div></div>').join('')||'<div class="empty">没有匹配聊天。</div>';bind();}
function filter(){const q=$('q').value.trim().toLowerCase();list(data.items.filter(r=>!q||JSON.stringify([r.title,r.project,r.groupName,r.branchId]).toLowerCase().includes(q)));}
async function load(){const res=await fetch('/api/catalog'),r=await res.json();if(!res.ok)throw Error(r.error);data=r;tree();filter();$('stamp').textContent='读取时间：'+new Date(data.readAt).toLocaleString('zh-CN')+'。刷新会按当前真实更新时间重新读取。';}
$('q').oninput=()=>data&&filter();$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('full').onclick=async()=>{const q=$('q').value.trim();if(!q)return;const b=$('full');b.disabled=true;$('status').textContent='正在搜索已有原文…';try{const res=await fetch('/api/search?q='+encodeURIComponent(q)),r=await res.json();if(!res.ok)throw Error(r.error);const ids=new Set((r.items||[]).map(x=>x.nativeId));list(data.items.filter(x=>ids.has(x.threadId)));$('status').textContent='已按原文匹配；仅显示当前本机活跃根聊天。';}catch(e){$('status').textContent=e.message;}finally{b.disabled=false;}};
load().catch(e=>$('status').textContent=e.message);
</script></body></html>
